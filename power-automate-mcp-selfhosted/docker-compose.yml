services:
  power-automate-mcp:
    build: .
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8787
      MCP_HTTP_API_KEY: ${MCP_HTTP_API_KEY:?set MCP_HTTP_API_KEY}
      POWER_PLATFORM_API_URL: https://api.powerplatform.com
      POWER_PLATFORM_API_VERSION: 2024-10-01
      POWER_PLATFORM_ACCESS_TOKEN_FILE: /run/secrets/power-platform-token
      MAX_REQUEST_BYTES: 1048576
      STORE_ENABLED: "true"
      STORE_PATH: /app/data/store.json
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - power-automate-store:/app/data
    secrets:
      - power-platform-token

secrets:
  power-platform-token:
    file: ./secrets/power-platform-token

volumes:
  power-automate-store:
