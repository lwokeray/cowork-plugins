swagger: "2.0"
info:
  title: Self-hosted Power Automate MCP
  description: Streamable MCP server for Power Automate discovery, diagnostics and guarded agent workflows.
  version: 0.1.0
host: replace-with-your-public-host.example.com
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  apiKey:
    type: apiKey
    name: x-api-key
    in: header
security:
  - apiKey: []
paths:
  /mcp:
    post:
      summary: Invoke the Streamable MCP server
      operationId: InvokeMCP
      description: MCP JSON-RPC endpoint. Replace the host with the public HTTPS reverse proxy address.
      x-ms-agentic-protocol: mcp-streamable-1.0
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
      responses:
        "200":
          description: MCP JSON-RPC response or streamable response
        "202":
          description: Accepted MCP request
        "400":
          description: Invalid MCP request
        "401":
          description: Missing or invalid x-api-key
        "403":
          description: Origin or policy rejected
        "413":
          description: Request is too large
        "500":
          description: Server error
