cards:
- id: it-operations-coordinator
  skill: it-operations-coordinator
  title: 整理 IT Operations 優先工作
  description: 將跨系統 IT 請求分流成具證據、Owner、風險與下一步的營運工作包。
  display_prompt: 幫我整理 IT Operations 優先事項
  prompt: 請整理 {{範圍與期間，例如：今天企業 IT Operations}} 的事件、變更、弱點、存取、雲端與 M365 工作。合併重複訊號，區分已確認事實、未知與阻塞，列出 Priority、影響、Owner、期限、依賴、來源及下一個安全行動；Help Desk case 請另外標示交接，不直接執行變更。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Catch up
  locale: zh-TW
- id: it-access-lifecycle
  skill: it-access-lifecycle
  title: 準備身分與權限生命週期作業
  description: 核對人員事件、授權來源、目前權限、目標權限與移除時點。
  display_prompt: 幫我準備存取權限異動
  prompt: 請處理 {{人員或事件，例如：Alex 於月底轉調到 Finance}} 的存取權限生命週期。核對唯一身份、正式人事事件、生效時間、目前與目標權限、Group／Role／License、特權存取、資料 Owner、SoD、例外與回收項目，先提供逐項變更預覽與核准需求，不直接新增或移除權限。
  products: [Copilot work]
  department: IT Operations
  task_type: Execute
  locale: zh-TW
- id: it-endpoint-support
  skill: it-endpoint-support
  title: 診斷企業端點問題
  description: 依裝置、使用者、管理狀態與時間軸建立可驗證的端點處理計畫。
  display_prompt: 幫我診斷端點問題
  prompt: 請診斷 {{使用者與裝置，例如：Alex 的 Windows 11 laptop}} 發生的 {{問題與時間，例如：今天無法套用合規原則}}。核對裝置身份、管理與合規狀態、近期變更、錯誤、影響範圍及已嘗試動作，提出最小風險驗證步驟、停止條件與需要核准的修復預覽，不宣稱未驗證的 root cause。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Troubleshoot
  locale: zh-TW
- id: it-m365-operations
  skill: it-m365-operations
  title: 處理 Microsoft 365 營運問題
  description: 整合 M365 service health、設定、權限與使用者證據形成營運處理包。
  display_prompt: 幫我處理 Microsoft 365 營運問題
  prompt: 請分析 {{工作負載與問題，例如：Exchange Online 郵件延遲}} 在 {{範圍與期間}} 的影響。核對 Service health、受影響對象、租戶設定、近期變更、權限與訊息證據，區分 Microsoft service issue、tenant configuration、user scope 與未知，提出驗證、緩解、溝通及升級建議；任何設定變更先提供差異預覽。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Troubleshoot
  locale: zh-TW
- id: it-network-diagnostics
  skill: it-network-diagnostics
  title: 建立網路診斷計畫
  description: 依來源、目的地、路徑、DNS、Proxy、Firewall 與時間證據限定網路故障。
  display_prompt: 幫我診斷網路連線問題
  prompt: 請診斷 {{來源、目的地與症狀，例如：台北辦公室無法連線到指定 SaaS}}。建立時間軸與影響範圍，核對 DNS、Route、Proxy、Firewall、VPN、Certificate、Latency、Packet loss 與近期變更，依最低風險順序提出測試、預期結果、分支判斷及升級資料，不要求停用安全控制作為捷徑。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Troubleshoot
  locale: zh-TW
- id: it-cloud-operations
  skill: it-cloud-operations
  title: 檢查雲端工作負載健康度
  description: 以資源、服務健康度、監控、部署與成本訊號建立雲端營運判斷。
  display_prompt: 幫我檢查雲端服務健康度
  prompt: 請檢查 {{Subscription、Resource group 或 workload}} 在 {{期間}} 的健康度與異常。核對資源身份、Service health、Availability、Metric、Log、Deployment、Dependency、Quota、Cost 與近期變更，列出已確認影響、主要假設、缺少證據、緩解路徑與具 Owner 的行動；不直接重啟、擴容或修改 Production。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Analyze
  locale: zh-TW
- id: it-incident-command
  skill: it-incident-command
  title: 協調重大 IT 事件
  description: 建立事件指揮、影響、時間軸、工作流、決策與利害關係人溝通。
  display_prompt: 幫我建立重大事件指揮包
  prompt: 請為 {{事件名稱與開始時間}} 建立 Major Incident Command Pack。確認影響、Severity、Incident commander、Technical leads、Business owner、時間軸、已知與未知、目前緩解、工作流、Decision log、更新節奏與下一次 checkpoint；所有 Production action 與外部公告分別列出核准人，不自行執行修復或宣告恢復。
  products: [Copilot work]
  department: IT Operations
  task_type: Coordinate
  locale: zh-TW
- id: it-problem-root-cause
  skill: it-problem-root-cause
  title: 建立問題與根因分析
  description: 從多次事件與技術證據建立可反證的原因假設及永久改善計畫。
  display_prompt: 幫我分析反覆發生的 IT 問題
  prompt: 請分析 {{問題與相關事件範圍}} 的 recurring pattern。重建時間軸、共同條件、差異、近期變更、偵測缺口與技術證據，區分 Trigger、Contributing factor、Root cause hypothesis 與已證實原因，提出反證測試、Workaround、永久修正、Owner、驗證方式及預防性監控；證據不足時不得宣稱 root cause。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Analyze
  locale: zh-TW
- id: it-change-release-control
  skill: it-change-release-control
  title: 審查 IT 變更與發布
  description: 核對範圍、風險、依賴、測試、回復與核准形成受控變更包。
  display_prompt: 幫我審查這項 IT 變更
  prompt: 請審查 {{Change／Release 名稱、環境與窗口}}。核對目的、精確變更、受影響服務、Dependency、Security、測試證據、Monitoring、Communication、Implementation、Rollback、Owner 與 Approval，依證據給出 Ready／Revise／Stop；不要把排定窗口視為已核准，也不要直接部署。
  products: [Copilot work]
  department: IT Operations
  task_type: Review
  locale: zh-TW
- id: it-security-response
  skill: it-security-response
  title: 協調資安事件回應
  description: 依告警、資產、身分、時間軸與證據建立受控的調查與遏止建議。
  display_prompt: 幫我處理資安告警或事件
  prompt: 請處理 {{Alert／Incident ID 與時間範圍}}。確認資料來源、受影響身份與資產、Severity、Timeline、Indicator、已知行為、可能範圍、證據保存及通知需求，區分觀察、推論與未知，提出調查、遏止、清除與復原建議；停權、隔離、刪除或封鎖前必須顯示影響與核准需求。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Respond
  locale: zh-TW
- id: it-vulnerability-compliance
  skill: it-vulnerability-compliance
  title: 整理弱點與合規修復
  description: 將弱點、資產曝險、控制要求與例外轉成具優先順序的修復計畫。
  display_prompt: 幫我整理弱點與合規缺口
  prompt: 請分析 {{弱點、控制或掃描範圍}}。核對 CVE／Finding、資產身份、Internet exposure、Exploitability、Business criticality、現有控制、Patch／Mitigation、Owner、SLA、Exception 與證據日期，產出風險優先序與修復驗證計畫；不只依 CVSS 排序，也不自行接受風險或宣稱合規。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Analyze
  locale: zh-TW
- id: it-backup-recovery
  skill: it-backup-recovery
  title: 檢查備份與復原準備度
  description: 核對保護範圍、RPO/RTO、備份證據、Restore test 與依賴。
  display_prompt: 幫我檢查備份與復原能力
  prompt: 請檢查 {{服務、資料或工作負載}} 的 Backup／Recovery readiness。核對正式 RPO／RTO、Backup policy、最新成功點、Immutability、Encryption、Access、Retention、Dependency、Restore procedure 與最近測試證據，指出 Coverage gap、單點風險、測試計畫與 Owner；沒有成功 Restore evidence 時不得宣稱可復原。
  products: [Copilot work]
  department: IT Operations
  task_type: Review
  locale: zh-TW
- id: it-asset-license-management
  skill: it-asset-license-management
  title: 整理 IT 資產與授權
  description: 以可信 inventory、ownership、使用與成本證據處理資產及 License 決策。
  display_prompt: 幫我檢查 IT 資產與授權
  prompt: 請檢查 {{資產或 License 範圍，例如：Microsoft 365 授權}} 在 {{期間}} 的配置與使用。核對唯一資產、Owner、Lifecycle、Assignment、Entitlement、Usage、Cost、Contract、Renewal、Security state 與資料品質，列出重複、閒置、缺漏與回收候選；移除授權或處置資產前提供使用者影響與核准預覽。
  products: [Copilot work]
  department: IT Operations
  task_type: Analyze
  locale: zh-TW
- id: it-vendor-escalation
  skill: it-vendor-escalation
  title: 準備供應商技術升級
  description: 將問題、影響、時間軸、證據與明確請求整理成可行動的 Vendor case。
  display_prompt: 幫我準備供應商升級資料
  prompt: 請為 {{供應商、服務與問題}} 建立 Vendor Escalation Pack。整理 Tenant／Subscription 或合約識別、Business impact、Severity、開始時間、重現步驟、錯誤、時間軸、已排除項目、附件清單、可分享與不可分享資料、SLA、Case ID 與明確請求，並準備更新草稿；不暴露 secret，也不在核准前送出。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Prepare
  locale: zh-TW
- id: it-knowledge-runbook
  skill: it-knowledge-runbook
  title: 建立 IT Runbook
  description: 將已驗證操作轉為具前提、步驟、分支、回復與驗證的受控知識。
  display_prompt: 幫我建立或更新 IT Runbook
  prompt: 請根據 {{已驗證來源與操作範圍}} 建立或更新 Runbook。包含適用與排除情境、權限與前提、輸入、逐步操作、分支判斷、Expected result、停止條件、Rollback、Validation、Escalation、Owner、Review date 與版本差異；未驗證步驟標示待測試，不直接發布成正式知識。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Create
  locale: zh-TW
- id: it-operations-reporting
  skill: it-operations-reporting
  title: 建立 IT 營運報告
  description: 將事件、變更、可用性、風險與容量資料轉成可決策的營運報告。
  display_prompt: 幫我準備 IT Operations 報告
  prompt: 請為 {{受眾與期間，例如：主管本週營運會議}} 建立 IT Operations Report。核對資料期間、範圍與來源，整理 Availability、Incidents、Changes、Security、Vulnerability、Capacity、Backup、Vendor、SLA、趨勢與重大差異，標示資料限制、Owner、決策及具體 asks；不要用無定義的紅黃綠或把缺資料當成正常。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Prepare
  locale: zh-TW
- id: it-automation-governance
  skill: it-automation-governance
  title: 審查 IT Automation
  description: 檢查自動化的身份、權限、觸發、錯誤、復原、監控與責任邊界。
  display_prompt: 幫我審查 IT Automation 風險
  prompt: 請審查 {{Flow、Script、Agent 或 Automation 名稱}}。核對 Owner、Business purpose、Identity、Permission、Trigger、Input trust、Action scope、Concurrency、Idempotency、Error handling、Secret、Logging、Alert、Rollback、Human approval、DLP 與停止機制，產出風險與修正清單；高風險寫入不得在未核准下自動執行。
  products: [Copilot work, Copilot web]
  department: IT Operations
  task_type: Review
  locale: zh-TW
