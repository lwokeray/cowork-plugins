cards:
- id: case-intake-triage
  skill: case-intake-triage
  title: 接收並分流 IT Case
  description: 將新進 IT 問題整理成具影響、優先級、缺漏資料與路由建議的 Case intake。
  display_prompt: 幫我接收並分流 IT 問題
  prompt: 請將 {{使用者問題或來源，例如：這封求助郵件}} 整理為 IT Help Desk Case Intake。確認 Requester、Affected service、症狀、開始時間、影響範圍、Urgency、已嘗試步驟、附件、相似 Case、缺少資料與建議 Queue／Owner，區分事實與推論；先提供 Case 預覽，不直接建立、改 Priority 或指派。
  products: [Copilot work]
  department: IT Help Desk
  task_type: Triage
  locale: zh-TW
- id: case-brief
  skill: case-brief
  title: 建立 IT Case Brief
  description: 從單一 Case、活動、SLA 與知識脈絡建立可快速接手的完整摘要。
  display_prompt: 幫我整理這個 IT Case
  prompt: 請為 {{Case number}} 建立一頁 Case Brief。整理 Requester、Service、Priority、Status、Owner、Queue、SLA、最新互動、完整時間軸、已嘗試動作、Knowledge、附件、阻塞、風險、未知與建議下一步，每項重要內容保留來源與日期；只讀取資料，不修改 Case。
  products: [Copilot work]
  department: IT Help Desk
  task_type: Catch up
  locale: zh-TW
- id: technical-troubleshooting
  skill: technical-troubleshooting
  title: 建立技術排錯計畫
  description: 依 Case 證據建立低風險、可分支、可驗證且不重複的 troubleshooting。
  display_prompt: 幫我排查這個技術問題
  prompt: 請針對 {{Case number 與症狀}} 建立 Troubleshooting Plan。先重建已嘗試步驟與結果，確認影響範圍、近期變更、Known issue 與必要環境，依最低風險順序列出測試、Expected result、分支判斷、停止條件、回復與需升級的證據；不要重複失敗步驟或宣稱未證實的 root cause。
  products: [Copilot work, Copilot web]
  department: IT Help Desk
  task_type: Troubleshoot
  locale: zh-TW
- id: knowledge-grounded-reply
  skill: knowledge-grounded-reply
  title: 撰寫知識型支援回覆
  description: 依目前 Case 與核准 Knowledge 建立清楚、安全、可供使用者執行的回覆草稿。
  display_prompt: 幫我撰寫 IT 支援回覆
  prompt: 請為 {{Case number}} 撰寫 Requester-ready 回覆。只使用目前 Case 與適用版本的核准 Knowledge，說明已了解的問題、必要步驟、預期結果、注意事項、需要補充的資料與下一次回覆時間；找不到可靠 Knowledge 時明確說明並建議升級，先提供草稿，不直接寄送或標記 resolved。
  products: [Copilot work]
  department: IT Help Desk
  task_type: Create
  locale: zh-TW
- id: requester-communication
  skill: requester-communication
  title: 準備 Case 溝通
  description: 依 Case 狀態、受眾與目的建立準確且不洩漏內部資訊的支援訊息。
  display_prompt: 幫我準備 Case 更新訊息
  prompt: 請為 {{Case number 與對象}} 準備 {{訊息類型，例如：進度更新或補件提醒}}。核對目前 Status、已完成工作、尚在處理內容、需要對方提供的資料、可承諾的下一步與時間，避免揭露內部評論、其他使用者資料或未核准 root cause；先顯示完整傳送預覽。
  products: [Copilot work]
  department: IT Help Desk
  task_type: Create
  locale: zh-TW
- id: service-request-fulfillment
  skill: service-request-fulfillment
  title: 準備服務請求履行
  description: 核對 Catalog、資格、輸入、核准、SLA 與依賴後建立可執行 Fulfillment plan。
  display_prompt: 幫我處理服務請求
  prompt: 請處理 {{Case／Request number 與服務項目}}。確認 Requester identity、Catalog item、Eligibility、Required inputs、Approval、License、Dependency、SLA、Fulfillment owner、Validation 與 Closure criteria，列出缺漏、風險及逐項執行預覽；沒有授權或必要核准時停止，不把一般 Incident 當成標準 Request。
  products: [Copilot work]
  department: IT Help Desk
  task_type: Execute
  locale: zh-TW
- id: escalation-handoff
  skill: escalation-handoff
  title: 建立技術升級交接
  description: 將 Case 影響、證據、時間軸與已嘗試動作整理給下一線 Resolver。
  display_prompt: 幫我準備 Case 升級交接
  prompt: 請為 {{Case number}} 建立 Escalation Handoff。整理影響與 Severity、完整時間軸、環境、錯誤、重現、已嘗試動作及結果、Knowledge、附件、目前假設、已排除項目、缺少證據、建議 Resolver type 與明確請求；不重複第一線調查，也不在沒有證據時指定 root cause 或 Queue。
  products: [Copilot work]
  department: IT Help Desk
  task_type: Prepare
  locale: zh-TW
- id: major-incident-coordination
  skill: major-incident-coordination
  title: 協調 Help Desk Major Incident
  description: 從多筆 Case 建立影響範圍、關聯、溝通、更新節奏與升級工作包。
  display_prompt: 幫我協調大量相同 IT 問題
  prompt: 請針對 {{事件或相同 Case 範圍}} 建立 Help Desk Major Incident Coordination Pack。確認共同症狀、開始時間、受影響服務與人數、重複 Case、Master incident、Severity、技術 Owner、Requester communication、Known workaround、更新節奏及下一個 checkpoint；不自行關閉子 Case 或發布全公司公告。
  products: [Copilot work]
  department: IT Help Desk
  task_type: Coordinate
  locale: zh-TW
- id: recurring-issue-analysis
  skill: recurring-issue-analysis
  title: 分析重複 IT 問題
  description: 對相似 Cases 去重、聚類並找出共同條件、證據缺口及 Problem 候選。
  display_prompt: 幫我分析重複發生的 IT Cases
  prompt: 請分析 {{Case 範圍與期間，例如：最近 90 天 VPN Cases}}。先定義相似條件並去除重複，依症狀、服務、裝置、地點、時間、變更與處理結果聚類，列出頻率、影響、共同因素、反證、Workaround、Knowledge gap 與 Problem candidate；不要只靠關鍵字或直接宣稱共同 root cause。
  products: [Copilot work, Copilot web]
  department: IT Help Desk
  task_type: Analyze
  locale: zh-TW
- id: incident-review
  skill: incident-review
  title: 建立事件後檢討
  description: 依 Case 與事件記錄建立無責備時間軸、決策、偵測與改善追蹤。
  display_prompt: 幫我做 IT 事件檢討
  prompt: 請為 {{Incident／Case 範圍}} 建立 Post-Incident Review。使用可驗證時間軸整理 Impact、Detection、Triage、Escalation、Communication、Mitigation、Recovery、Decision、有效與無效動作，區分 root cause evidence 與 hypothesis，建立具 Owner、Due、Success evidence 的改善項目；不要把個人歸責當成根因。
  products: [Copilot work]
  department: IT Help Desk
  task_type: Review
  locale: zh-TW
- id: knowledge-maintenance
  skill: knowledge-maintenance
  title: 維護 Help Desk Knowledge
  description: 依已解決 Cases、回饋與政策來源建立可審查的 Knowledge 新增或修訂稿。
  display_prompt: 幫我更新 IT Knowledge
  prompt: 請根據 {{Cases、現有文章與核准來源}} 建立 Knowledge maintenance proposal。確認目標受眾、適用範圍、症狀、前提、步驟、Expected result、警告、Escalation、版本、Owner、Review date 與來源，列出現有文章差異、重複與過期內容；未經 SME／Knowledge owner 審查前不直接發布。
  products: [Copilot work, Copilot web]
  department: IT Help Desk
  task_type: Edit
  locale: zh-TW
- id: supervisor-case-review
  skill: supervisor-case-review
  title: 執行主管 Case Review
  description: 以證據檢查 Queue 中的逾期、阻塞、錯誤優先級與需要升級的 Cases。
  display_prompt: 幫我做 Help Desk 主管檢查
  prompt: 請檢查 {{Queue、Team 或 Case 範圍}} 截至 {{時間}} 的 open Cases。依可見的 Priority、Status、SLA indicator、Age、最近互動、Owner、等待原因與阻塞找出需要注意的項目，說明證據、Requester impact、建議行動及 Owner；不要只按建立日期推定 SLA breach，也不直接改派、改 Priority 或關閉。
  products: [Copilot work]
  department: IT Help Desk
  task_type: Analyze
  locale: zh-TW
