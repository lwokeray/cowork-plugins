name: Release Cowork Plugins

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cowork-plugins-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_repo.py
      - name: Build all plugins
        run: |
          for plugin in plugins/*-cowork; do
            python scripts/build_plugin.py "$(basename "$plugin")"
          done
      - name: Publish downloadable ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cowork-plugins-${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/*.zip build/*.sha256 --clobber
          else
            gh release create "$tag"               build/*.zip               build/*.sha256               --target "$GITHUB_SHA"               --title "Cowork Plugins"               --notes "Download the ZIP for the role-specific Cowork Plugin you need. SHA-256 files are included for integrity verification."
          fi
