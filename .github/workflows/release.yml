name: Release Cowork Plugins

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cowork-plugins-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_repo.py
      - name: Build all plugins and Prompt Cards
        run: |
          for plugin in plugins/*-cowork; do
            plugin_id="$(basename "$plugin")"
            python scripts/build_plugin.py "$plugin_id"
            version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$plugin/manifest.json")"
            cp "$plugin/prompts/prompt-cards.csv" "build/${plugin_id}-${version}-prompt-cards.csv"
          done
      - name: Publish downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cowork-plugins-${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/*.zip build/*-prompt-cards.csv --clobber
          else
            gh release create "$tag" build/*.zip build/*-prompt-cards.csv --target "$GITHUB_SHA" --title "Cowork Plugins" --notes "Each role-specific Plugin includes a deployment ZIP and an import-ready Prompt Card CSV."
          fi
